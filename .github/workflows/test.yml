name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      # Static checks: the build compiles, but typecheck also covers the test
      # files and the sweep-instrument declarations.
      - run: npm run typecheck
      - run: npm test
      # Offline integration: spawn the server with no fixture and assert the
      # graceful-degradation paths (knowledge/state unavailable, writes gated).
      - run: npm run smoke
      # Evidence gate: every `measured` catalog row must be backed by a valid
      # committed record. Runs offline against the committed records + catalog.
      - run: npm run sweep:gate
